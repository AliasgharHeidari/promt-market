<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Market</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">

  <style>
    /* ─── CSS Variables ─── */
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #1e293b;
      --bg-hover: #2d3a4f;
      --bg-input: #2d3a4f;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #334155;
      --shadow-color: rgba(0, 0, 0, 0.3);
      --badge-bg: #2d3a4f;
      --scrollbar-track: #1e293b;
      --scrollbar-thumb: #475569;
      --success: #22c55e;
      --error: #ef4444;
      --info: #3b82f6;
      --warning: #f59e0b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 1.5rem;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    .container { max-width: 1400px; margin: 0 auto; }

    /* ─── Header ─── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--bg-secondary);
      padding: 1rem 2rem;
      border-radius: 1rem;
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .header h1 {
      font-weight: 700;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .header .badge {
      background: #1e3a5f;
      color: #60a5fa;
      font-size: 0.6rem;
      padding: 0.1rem 0.7rem;
      border-radius: 999px;
      font-weight: 600;
    }
    .header .status {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .header .status .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 0.3rem;
    }
    .dot.online { background: var(--success); }
    .dot.offline { background: var(--error); }

    .theme-toggle {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 0.6rem;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: 0.15s;
    }
    .theme-toggle:hover { background: var(--bg-hover); }

    /* ─── Grid ─── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ─── Cards ─── */
    .card {
      background: var(--bg-secondary);
      border-radius: 1rem;
      padding: 1.5rem 1.75rem;
      border: 1px solid var(--border-color);
      transition: 0.2s;
    }
    .card:hover { border-color: #475569; }
    .card h3 {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-primary);
    }
    .card .sub {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
    }

    /* ─── Form ─── */
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 0.8rem;
      margin-bottom: 0.2rem;
      color: var(--text-secondary);
    }
    input, textarea, select {
      width: 100%;
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      font-size: 0.85rem;
      background: var(--bg-input);
      color: var(--text-primary);
      transition: 0.15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--info);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    textarea { resize: vertical; min-height: 60px; font-family: inherit; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }

    /* ─── Buttons ─── */
    .btn {
      background: var(--info);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 1rem;
      width: 100%;
    }
    .btn:hover { opacity: 0.85; transform: scale(0.98); }
    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-outline:hover { background: var(--bg-hover); }
    .btn-sm {
      width: auto;
      padding: 0.3rem 1rem;
      margin-top: 0;
      font-size: 0.75rem;
    }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--error); }
    .btn-warning { background: var(--warning); color: #0f172a; }

    /* ─── Output / Result Box ─── */
    .output {
      margin-top: 1rem;
      background: var(--bg-primary);
      border-radius: 0.6rem;
      padding: 0.8rem 1rem;
      font-size: 0.8rem;
      max-height: 340px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      font-family: 'Inter', sans-serif;
      color: var(--text-secondary);
      word-break: break-word;
      line-height: 1.6;
    }
    .output .ok { color: var(--success); }
    .output .err { color: var(--error); }
    .output .info { color: var(--info); }
    .output .warn { color: var(--warning); }
    .output .placeholder { color: var(--text-muted); font-family: 'Inter', sans-serif; }

    /* ─── Pretty result banner (top line of an output box) ─── */
    .result-banner {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 0.7rem;
    }
    .result-banner.ok { color: var(--success); }
    .result-banner.err { color: var(--error); }
    .result-banner.info { color: var(--info); }

    /* ─── Key/value data card (e.g. user profile, login result) ─── */
    .data-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.45rem 0.9rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 0.6rem;
      padding: 0.8rem 1rem;
      font-family: 'Inter', sans-serif;
    }
    .data-card .k {
      color: var(--text-muted);
      font-size: 0.75rem;
      white-space: nowrap;
      align-self: center;
    }
    .data-card .v {
      color: var(--text-primary);
      font-size: 0.8rem;
      align-self: center;
      word-break: break-word;
    }
    .data-card .v.mono {
      font-family: monospace;
      font-size: 0.72rem;
      background: var(--bg-primary);
      padding: 0.15rem 0.5rem;
      border-radius: 0.3rem;
      display: inline-block;
      word-break: break-all;
    }
    .data-card .v .chip {
      display: inline-block;
      background: var(--badge-bg);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.7rem;
      padding: 0.1rem 0.6rem;
      border-radius: 999px;
    }

    /* ─── Prompt result list ─── */
    .prompt-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .prompt-item {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 0.6rem;
      padding: 0.7rem 0.9rem;
    }
    .prompt-item .pi-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
    }
    .prompt-item .pi-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-primary);
    }
    .prompt-item .pi-price {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--success);
      white-space: nowrap;
    }
    .prompt-item .pi-desc {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
      line-height: 1.5;
    }
    .prompt-item .pi-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .empty-state {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 1rem 0;
      font-family: 'Inter', sans-serif;
    }

    /* ─── Token Display ─── */
    .token-box {
      margin-top: 1.5rem;
      background: var(--bg-secondary);
      border-radius: 0.6rem;
      padding: 0.8rem 1.2rem;
      border: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    .token-box .label { font-weight: 500; font-size: 0.8rem; color: var(--text-secondary); }
    .token-box .value {
      font-family: monospace;
      font-size: 0.7rem;
      word-break: break-all;
      color: var(--text-primary);
      background: var(--bg-primary);
      padding: 0.2rem 0.6rem;
      border-radius: 0.3rem;
      flex: 1;
    }

    /* ─── Status Badge ─── */
    .status-badge {
      display: inline-block;
      background: var(--badge-bg);
      padding: 0.15rem 0.7rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    .flex { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
    .mt-1 { margin-top: 1rem; }
    .mb-1 { margin-bottom: 0.5rem; }

    @media (max-width: 600px) {
      body { padding: 0.8rem; }
      .header { flex-direction: column; align-items: stretch; }
      .row-2 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ═══ HEADER ═══ -->
  <header class="header">
    <h1>
      🧪 Prompt Market
      <span class="badge">v0.3</span>
      <span id="serverStatus" class="status-badge" style="background:#1e3a5f;color:#60a5fa;">● Online</span>
    </h1>
    <div class="status">
      <span>🔑 <span id="tokenStatus" style="color:var(--text-muted);">بدون توکن</span></span>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
      <button class="btn btn-sm" onclick="checkHealth()">🔄 Health</button>
    </div>
  </header>

  <!-- ═══ STATUS LINE ═══ -->
  <div class="card" style="margin-bottom:1.5rem; background:var(--bg-primary); border-color:var(--border-color);">
    <div class="flex-between">
      <span style="color:var(--text-secondary); font-size:0.85rem;">
        🟢 <span id="healthOutput">سرور در حال اجرا است</span>
      </span>
      <span style="color:var(--text-muted); font-size:0.75rem;">
        API: <code style="background:var(--bg-input);padding:0.1rem 0.5rem;border-radius:0.3rem;">http://localhost:8080</code>
      </span>
    </div>
  </div>

  <!-- ═══ GRID ═══ -->
  <div class="grid-2">

    <!-- ─── AUTH ─── -->
    <div class="card">
      <h3>🔐 احراز هویت</h3>
      <label>ایمیل</label>
      <input id="authEmail" value="test@example.com">
      <label>رمز عبور</label>
      <input id="authPass" type="password" value="password123">
      <label>نام کامل</label>
      <input id="authName" value="Test User">

      <div class="row-2" style="margin-top:0.5rem;">
        <button class="btn btn-sm btn-outline" onclick="registerUser()">📝 ثبت‌نام</button>
        <button class="btn btn-sm" onclick="loginUser()">🔑 ورود</button>
      </div>
      <div class="row-2">
        <button class="btn btn-sm btn-outline" onclick="refreshTokenFunc()">🔄 رفرش</button>
        <button class="btn btn-sm btn-outline" onclick="getProfile()">👤 پروفایل</button>
      </div>

      <label style="margin-top:1.2rem;">کد تایید ایمیل (۶ رقمی)</label>
      <input id="verifyCode" maxlength="6" placeholder="123456">
      <div class="row-2">
        <button class="btn btn-sm btn-success" onclick="verifyEmail()">✅ تایید ایمیل</button>
        <button class="btn btn-sm btn-warning" onclick="resendVerification()">📨 ارسال مجدد کد</button>
      </div>

      <div class="output" id="authOutput"><span class="placeholder">↳ نتیجه احراز هویت</span></div>
    </div>

    <!-- ─── PROMPT ─── -->
    <div class="card">
      <h3>📄 مدیریت پرامپت</h3>
      <label>عنوان</label>
      <input id="promptTitle" value="Professional SEO Content Prompt">
      <label>توضیحات</label>
      <input id="promptDesc" value="Generate SEO-optimized blog content">
      <label>دسته‌بندی</label>
      <input id="promptCategory" value="Content Creation">
      <div class="row-2">
        <div>
          <label>قیمت (تومان)</label>
          <input id="promptPrice" type="number" value="50000">
        </div>
        <div>
          <label>سطح</label>
          <select id="promptDifficulty">
            <option value="beginner">مبتدی</option>
            <option value="intermediate" selected>متوسط</option>
            <option value="advanced">پیشرفته</option>
          </select>
        </div>
      </div>
      <label>محتوای پرامپت</label>
      <textarea id="promptContent" rows="2">You are an expert SEO writer. Create a blog post about AI...</textarea>

      <div class="row-2">
        <button class="btn btn-sm" onclick="createPrompt()">➕ ایجاد</button>
        <button class="btn btn-sm btn-outline" onclick="listPrompts()">📋 لیست</button>
      </div>
      <div class="row-2">
        <button class="btn btn-sm btn-outline" onclick="searchPrompts()">🔍 جستجو</button>
        <button class="btn btn-sm btn-outline" onclick="getMyPrompts()">📁 پرامپت‌های من</button>
      </div>

      <div class="output" id="promptOutput"><span class="placeholder">↳ نتیجه عملیات</span></div>
    </div>
  </div>

  <!-- ═══ SEARCH BAR ═══ -->
  <div class="card" style="margin-top:1.5rem;">
    <div class="flex-between">
      <h3 style="margin:0; font-weight:600; font-size:1rem;">🔎 جستجوی پیشرفته</h3>
      <div class="flex">
        <input id="searchQuery" placeholder="جستجو..." style="width:160px;">
        <select id="searchCategory" style="width:130px;">
          <option value="">همه دسته‌ها</option>
          <option value="Content Creation">Content Creation</option>
          <option value="Programming">Programming</option>
          <option value="Data Science">Data Science</option>
          <option value="Marketing">Marketing</option>
        </select>
        <input id="searchMinPrice" placeholder="قیمت از" type="number" style="width:90px;">
        <input id="searchMaxPrice" placeholder="تا" type="number" style="width:90px;">
        <button class="btn btn-sm" onclick="searchPrompts()">🔍 برو</button>
      </div>
    </div>
  </div>

  <!-- ═══ TOKEN DISPLAY ═══ -->
  <div class="token-box">
    <span class="label">🔑 Access Token:</span>
    <span class="value" id="displayAccessToken">—</span>
    <span class="label" style="margin-left:0.8rem;">🔄 Refresh:</span>
    <span class="value" id="displayRefreshToken">—</span>
  </div>

</div>

<script>
  // ═══════════════════════════════════════════════
  //  STATE
  // ═══════════════════════════════════════════════
  let accessToken = localStorage.getItem('accessToken') || '';
  let refreshToken = localStorage.getItem('refreshToken') || '';
  let theme = localStorage.getItem('theme') || 'dark';

  const API_BASE = 'http://localhost:8080/api/v1';

  // ═══════════════════════════════════════════════
  //  THEME
  // ═══════════════════════════════════════════════
  function applyTheme(t) {
    theme = t;
    document.documentElement.style.setProperty('--bg-primary', t === 'dark' ? '#0f172a' : '#f8fafc');
    document.documentElement.style.setProperty('--bg-secondary', t === 'dark' ? '#1e293b' : '#ffffff');
    document.documentElement.style.setProperty('--bg-card', t === 'dark' ? '#1e293b' : '#ffffff');
    document.documentElement.style.setProperty('--bg-hover', t === 'dark' ? '#2d3a4f' : '#f1f5f9');
    document.documentElement.style.setProperty('--bg-input', t === 'dark' ? '#2d3a4f' : '#ffffff');
    document.documentElement.style.setProperty('--text-primary', t === 'dark' ? '#f1f5f9' : '#0f172a');
    document.documentElement.style.setProperty('--text-secondary', t === 'dark' ? '#94a3b8' : '#475569');
    document.documentElement.style.setProperty('--text-muted', t === 'dark' ? '#64748b' : '#94a3b8');
    document.documentElement.style.setProperty('--border-color', t === 'dark' ? '#334155' : '#e9edf2');
    document.documentElement.style.setProperty('--badge-bg', t === 'dark' ? '#2d3a4f' : '#f1f5f9');
    document.documentElement.style.setProperty('--scrollbar-track', t === 'dark' ? '#1e293b' : '#f1f5f9');
    document.documentElement.style.setProperty('--scrollbar-thumb', t === 'dark' ? '#475569' : '#cbd5e1');
    localStorage.setItem('theme', t);
    document.querySelector('.theme-toggle').textContent = t === 'dark' ? '☀️' : '🌙';
  }

  function toggleTheme() {
    applyTheme(theme === 'dark' ? 'light' : 'dark');
  }

  // ═══════════════════════════════════════════════
  //  HELPERS
  // ═══════════════════════════════════════════════
  function getHeaders(extra) {
    const h = { 'Content-Type': 'application/json', ...extra };
    if (accessToken) h['Authorization'] = `Bearer ${accessToken}`;
    return h;
  }

  function renderAuthOutput(html) {
    document.getElementById('authOutput').innerHTML = html;
  }
  function renderPromptOutput(html) {
    document.getElementById('promptOutput').innerHTML = html;
  }

  function updateTokenDisplay() {
    document.getElementById('displayAccessToken').textContent = accessToken ? accessToken.slice(0, 35) + '…' : '—';
    document.getElementById('displayRefreshToken').textContent = refreshToken ? refreshToken.slice(0, 35) + '…' : '—';
    document.getElementById('tokenStatus').textContent = accessToken ? '✅ توکن فعال' : '❌ بدون توکن';
    document.getElementById('tokenStatus').style.color = accessToken ? 'var(--success)' : 'var(--error)';
    localStorage.setItem('accessToken', accessToken);
    localStorage.setItem('refreshToken', refreshToken);
  }

  // ═══════════════════════════════════════════════
  //  PRETTY RENDER HELPERS
  // ═══════════════════════════════════════════════
  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function banner(kind, text) {
    const icon = kind === 'ok' ? '✅' : kind === 'err' ? '❌' : 'ℹ️';
    return `<div class="result-banner ${kind}">${icon} ${esc(text)}</div>`;
  }

  // Renders a plain "key: value" card from an object. `rows` is an array of
  // [label, value, opts] where opts can set { mono: true, chip: true }.
  function dataCard(rows) {
    const body = rows
      .filter(r => r[1] !== undefined && r[1] !== null && r[1] !== '')
      .map(([label, value, opts = {}]) => {
        let v = esc(value);
        if (opts.mono) v = `<span class="v mono">${v}</span>`;
        else if (opts.chip) v = `<span class="chip">${v}</span>`;
        return `<div class="k">${esc(label)}</div><div class="v">${v}</div>`;
      })
      .join('');
    return `<div class="data-card">${body}</div>`;
  }

  function errorCard(message) {
    return banner('err', message || 'خطای نامشخص');
  }

  function fieldErrorMessage(d, fallback) {
    if (d && typeof d.error === 'string') return d.error;
    return fallback || 'خطایی رخ داد';
  }

  // ═══════════════════════════════════════════════
  //  HEALTH
  // ═══════════════════════════════════════════════
  function checkHealth() {
    fetch(API_BASE + '/health')
      .then(r => r.json())
      .then(d => {
        document.getElementById('serverStatus').textContent = '● Online';
        document.getElementById('serverStatus').style.color = 'var(--success)';
        document.getElementById('healthOutput').textContent = '✅ ' + d.message + ' (status: ' + d.status + ')';
      })
      .catch(() => {
        document.getElementById('serverStatus').textContent = '● Offline';
        document.getElementById('serverStatus').style.color = 'var(--error)';
        document.getElementById('healthOutput').textContent = '⚠️ اتصال به سرور برقرار نیست';
      });
  }

  // ═══════════════════════════════════════════════
  //  AUTH
  // ═══════════════════════════════════════════════
  function registerUser() {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPass').value;
    const full_name = document.getElementById('authName').value;

    fetch(API_BASE + '/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, full_name }),
    })
      .then(r => r.json())
      .then(d => {
        const isOk = !!d.data?.id;
        if (isOk) {
          renderAuthOutput(
            banner('ok', 'ثبت‌نام موفق — کد تایید به ایمیل ارسال شد') +
            dataCard([
              ['شناسه', d.data.id, { mono: true }],
              ['ایمیل', d.data.email],
              ['نام کامل', d.data.full_name],
              ['نقش', d.data.role, { chip: true }],
            ])
          );
        } else {
          renderAuthOutput(errorCard(fieldErrorMessage(d, 'ثبت‌نام ناموفق بود')));
        }
      })
      .catch(e => renderAuthOutput(errorCard(e.message)));
  }

  function verifyEmail() {
    const email = document.getElementById('authEmail').value;
    const code = document.getElementById('verifyCode').value;

    fetch(API_BASE + '/auth/verify-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code }),
    })
      .then(r => r.json())
      .then(d => {
        const isOk = typeof d.message === 'string' && !d.error;
        if (isOk) {
          renderAuthOutput(banner('ok', d.message || 'ایمیل با موفقیت تایید شد'));
        } else {
          renderAuthOutput(errorCard(fieldErrorMessage(d, 'تایید ایمیل ناموفق بود')));
        }
      })
      .catch(e => renderAuthOutput(errorCard(e.message)));
  }

  function resendVerification() {
    const email = document.getElementById('authEmail').value;

    fetch(API_BASE + '/auth/resend-verification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    })
      .then(r => r.json())
      .then(d => {
        const isOk = typeof d.message === 'string' && !d.error;
        if (isOk) {
          renderAuthOutput(banner('ok', d.message || 'کد تایید مجدداً ارسال شد'));
        } else {
          renderAuthOutput(errorCard(fieldErrorMessage(d, 'ارسال مجدد کد ناموفق بود')));
        }
      })
      .catch(e => renderAuthOutput(errorCard(e.message)));
  }

  function loginUser() {
    const email = document.getElementById('authEmail').value;
    const password = document.getElementById('authPass').value;

    fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    })
      .then(r => r.json())
      .then(d => {
        if (d.data?.tokens) {
          accessToken = d.data.tokens.access_token;
          refreshToken = d.data.tokens.refresh_token;
          updateTokenDisplay();
        }
        const isOk = !!d.data?.tokens?.access_token;
        if (isOk) {
          const u = d.data.user;
          renderAuthOutput(
            banner('ok', 'ورود موفق') +
            dataCard([
              ['شناسه', u.id, { mono: true }],
              ['ایمیل', u.email],
              ['نام کامل', u.full_name],
              ['نقش', u.role, { chip: true }],
              ['امتیاز', u.rating],
            ])
          );
        } else {
          renderAuthOutput(errorCard(fieldErrorMessage(d, 'ورود ناموفق بود')));
        }
      })
      .catch(e => renderAuthOutput(errorCard(e.message)));
  }

  function refreshTokenFunc() {
    if (!refreshToken) {
      renderAuthOutput(errorCard('Refresh Token موجود نیست'));
      return;
    }
    fetch(API_BASE + '/auth/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken }),
    })
      .then(r => r.json())
      .then(d => {
        if (d.data?.access_token) {
          accessToken = d.data.access_token;
          if (d.data.refresh_token) refreshToken = d.data.refresh_token;
          updateTokenDisplay();
        }
        const isOk = !!d.data?.access_token;
        if (isOk) {
          renderAuthOutput(banner('ok', 'توکن جدید با موفقیت دریافت شد'));
        } else {
          renderAuthOutput(errorCard(fieldErrorMessage(d, 'دریافت توکن جدید ناموفق بود')));
        }
      })
      .catch(e => renderAuthOutput(errorCard(e.message)));
  }

  function getProfile() {
    if (!accessToken) {
      renderAuthOutput(errorCard('ابتدا وارد شوید'));
      return;
    }
    fetch(API_BASE + '/profile', { method: 'GET', headers: getHeaders() })
      .then(r => r.json())
      .then(d => {
        const isOk = !!d.data?.email;
        if (isOk) {
          const u = d.data;
          renderAuthOutput(
            banner('ok', 'پروفایل کاربر') +
            dataCard([
              ['شناسه', u.id, { mono: true }],
              ['ایمیل', u.email],
              ['نام کامل', u.full_name],
              ['نقش', u.role, { chip: true }],
              ['تخصص', u.expertise],
              ['بیوگرافی', u.bio],
              ['امتیاز', u.rating],
              ['تعداد فروش', u.total_sales],
              ['موجودی کیف پول', u.wallet_balance],
            ])
          );
        } else {
          renderAuthOutput(errorCard(fieldErrorMessage(d, 'دریافت پروفایل ناموفق بود')));
        }
      })
      .catch(e => renderAuthOutput(errorCard(e.message)));
  }

  // ═══════════════════════════════════════════════
  //  PROMPT
  // ═══════════════════════════════════════════════
  // Renders an array of prompt objects as a list of cards.
  function promptList(prompts) {
    if (!prompts || prompts.length === 0) {
      return '<div class="empty-state">هیچ پرامپتی یافت نشد</div>';
    }
    const items = prompts.map(p => {
      const price = (p.price !== undefined && p.price !== null)
        ? Number(p.price).toLocaleString('fa-IR') + ' تومان'
        : '';
      return `
        <div class="prompt-item">
          <div class="pi-top">
            <span class="pi-title">${esc(p.title || 'بدون عنوان')}</span>
            ${price ? `<span class="pi-price">${esc(price)}</span>` : ''}
          </div>
          ${p.description ? `<div class="pi-desc">${esc(p.description)}</div>` : ''}
          <div class="pi-meta">
            ${p.category ? `<span class="chip">${esc(p.category)}</span>` : ''}
            ${p.difficulty ? `<span class="chip">${esc(p.difficulty)}</span>` : ''}
          </div>
        </div>`;
    }).join('');
    return `<div class="prompt-list">${items}</div>`;
  }

  function createPrompt() {
    if (!accessToken) {
      renderPromptOutput(errorCard('ابتدا وارد شوید'));
      return;
    }
    const body = {
      title: document.getElementById('promptTitle').value,
      description: document.getElementById('promptDesc').value,
      category: document.getElementById('promptCategory').value,
      content: document.getElementById('promptContent').value,
      price: parseInt(document.getElementById('promptPrice').value) || 0,
      difficulty: document.getElementById('promptDifficulty').value,
      language: 'english',
      tags: ['seo', 'content'],
    };

    fetch(API_BASE + '/prompts', {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify(body),
    })
      .then(r => r.json())
      .then(d => {
        const isOk = !!d.data?.id;
        if (isOk) {
          renderPromptOutput(
            banner('ok', 'پرامپت با موفقیت ایجاد شد') +
            dataCard([
              ['شناسه', d.data.id, { mono: true }],
              ['عنوان', d.data.title],
              ['دسته‌بندی', d.data.category, { chip: true }],
              ['قیمت', d.data.price !== undefined ? Number(d.data.price).toLocaleString('fa-IR') + ' تومان' : ''],
            ])
          );
        } else {
          renderPromptOutput(errorCard(fieldErrorMessage(d, 'ایجاد پرامپت ناموفق بود')));
        }
      })
      .catch(e => renderPromptOutput(errorCard(e.message)));
  }

  function listPrompts() {
    fetch(API_BASE + '/prompts?page=1&limit=10')
      .then(r => r.json())
      .then(d => {
        if (d.error) { renderPromptOutput(errorCard(d.error)); return; }
        const count = d.data?.length || 0;
        renderPromptOutput(banner('info', `${count} پرامپت یافت شد`) + promptList(d.data));
      })
      .catch(e => renderPromptOutput(errorCard(e.message)));
  }

  function searchPrompts() {
    const q = document.getElementById('searchQuery').value || '';
    const cat = document.getElementById('searchCategory').value || '';
    const min = document.getElementById('searchMinPrice').value || '';
    const max = document.getElementById('searchMaxPrice').value || '';

    let url = '/prompts/search?';
    if (q) url += `search=${encodeURIComponent(q)}&`;
    if (cat) url += `category=${encodeURIComponent(cat)}&`;
    if (min) url += `min_price=${min}&`;
    if (max) url += `max_price=${max}&`;
    url += 'page=1&limit=20';

    fetch(API_BASE + url)
      .then(r => r.json())
      .then(d => {
        if (d.error) { renderPromptOutput(errorCard(d.error)); return; }
        const count = d.data?.length || 0;
        renderPromptOutput(banner('info', `${count} نتیجه یافت شد`) + promptList(d.data));
      })
      .catch(e => renderPromptOutput(errorCard(e.message)));
  }

  function getMyPrompts() {
    if (!accessToken) {
      renderPromptOutput(errorCard('ابتدا وارد شوید'));
      return;
    }
    fetch(API_BASE + '/my-prompts?page=1&limit=10', { method: 'GET', headers: getHeaders() })
      .then(r => r.json())
      .then(d => {
        if (d.error) { renderPromptOutput(errorCard(d.error)); return; }
        const count = d.data?.length || 0;
        renderPromptOutput(banner('info', `${count} پرامپت از شما`) + promptList(d.data));
      })
      .catch(e => renderPromptOutput(errorCard(e.message)));
  }

  // ═══════════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════════
  applyTheme(theme);
  updateTokenDisplay();
  checkHealth();
</script>
